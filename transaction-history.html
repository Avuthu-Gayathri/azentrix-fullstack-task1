<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Transaction History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
      <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="#">
            Personal Budget Tracker
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="/dashboard">
                Dashboard
            </a>

            <a class="nav-link" href="/">
                Add Transaction
            </a>

            <a class="nav-link active" href="/history">
                History
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Transaction History
    </h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="t : ${transactions}">

            <td th:text="${t.id}"></td>

            <td th:text="${t.type}"></td>

            <td th:text="${t.category}"></td>

            <td th:text="${t.amount}"></td>

            <td th:text="${t.transactionDate}"></td>

            <td>

                <a th:href="@{/edit/{id}(id=${t.id})}"
                   class="btn btn-warning btn-sm">

                    Edit

                </a>

               <a th:href="@{/delete/{id}(id=${t.id})}"
   class="btn btn-danger btn-sm"
   onclick="return confirm('Are you sure you want to delete this transaction?')">
                    Delete

                </a>

            </td>

        </tr>

        </tbody>
        <tr th:if="${#lists.isEmpty(transactions)}">

    <td colspan="6" class="text-center">

        No Transactions Found

    </td>

</tr>

    </table>

</div>
<footer class="bg-dark text-white text-center p-3 mt-5">

    <p class="mb-0">

        Personal Budget Tracker © 2026

    </p>

</footer>
</body>
</html>
