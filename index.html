<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Personal Budget Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
      <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Personal Budget Tracker
    </h1>

    <div class="card p-4">

        <form th:action="@{/save}"
              th:object="${transaction}"
              method="post">
             <input type="hidden" th:field="*{id}">

            <div class="row">

                <div class="col-md-3">
                    <label>Type</label>

                    <select class="form-control"
                            th:field="*{type}">
                        <option value="Income">
                            Income
                        </option>

                        <option value="Expense">
                            Expense
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label>Category</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{category}">
                </div>

                <div class="col-md-3">
                    <label>Amount</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{amount}">
                </div>

                <div class="col-md-3">
                    <label>Date</label>

                    <input type="date"
                           class="form-control"
                           th:field="*{transactionDate}">
                </div>

            </div>

            <button class="btn btn-primary mt-3">
                Save Transaction
            </button>

        </form>

    </div>

</div>
<footer class="bg-dark text-white text-center p-3 mt-5">

    <p class="mb-0">

        Personal Budget Tracker © 2026

    </p>

</footer>
</body>
</html>
